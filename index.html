<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Jogo da velha</title>
  </head>
  <body>
    <div class="wrapper" id="game-board">
      <div class="cell" id="c00" onclick="markCell(0, 0)"></div>
      <div class="cell" id="c01" onclick="markCell(0, 1)"></div>
      <div class="cell" id="c02" onclick="markCell(0, 2)"></div>
      <div class="cell" id="c10" onclick="markCell(1, 0)"></div>
      <div class="cell" id="c11" onclick="markCell(1, 1)"></div>
      <div class="cell" id="c12" onclick="markCell(1, 2)"></div>
      <div class="cell" id="c20" onclick="markCell(2, 0)"></div>
      <div class="cell" id="c21" onclick="markCell(2, 1)"></div>
      <div class="cell" id="c22" onclick="markCell(2, 2)"></div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
